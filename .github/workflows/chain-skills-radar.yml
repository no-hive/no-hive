name: Update skills radar

on:
  workflow_dispatch:
  push:
    paths:
      - radar.json
      - .github/workflows/chain-skills-radar.yml

permissions:
  contents: write

concurrency:
  group: skills-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Generate radar
        uses: no-hive/chain_skills_radar@main
        with:
          config: radar.json
          output: assets/radar.svg
          format: square
          size: 1100
          label_font_size: 36
          title_font_size: 40
          compact: true

      - name: Commit updated radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update skills radar"
          git push origin "HEAD:${GITHUB_REF_NAME}"
